name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all targets
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X main.version=${version}"
          mkdir -p dist
          for target in windows/amd64/.exe linux/amd64/ linux/arm64/ darwin/amd64/ darwin/arm64/; do
            goos="${target%%/*}"
            rest="${target#*/}"
            goarch="${rest%%/*}"
            ext="${rest#*/}"
            echo "building ruget-${goos}-${goarch}${ext}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" \
              -o "dist/ruget-${goos}-${goarch}${ext}" .
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
